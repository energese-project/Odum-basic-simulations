<div class="explorer">
  <label class="filter">
    <span class="sr-only">Filter programs</span>
    <input type="search" placeholder="Filter by title, tag or fidelity" autocomplete="off"
           spellcheck="false" data-testid="library-filter" />
  </label>

  <ul class="list" data-testid="library-list" aria-label="Programs"></ul>
  <p class="note" data-testid="library-empty" hidden>No program matches.</p>
</div>
