<div class="console">
  <pre class="out" data-testid="console-output" aria-live="polite" aria-atomic="false"></pre>
  <form class="input-row" hidden>
    <label class="prompt" for="console-input">Input</label>
    <input id="console-input" type="text" autocomplete="off" spellcheck="false"
           data-testid="console-input" />
    <button type="submit">Enter</button>
  </form>
</div>
