<section class="meta" aria-label="Program details">
  <h2 class="title" data-testid="meta-title"></h2>
  <p class="description" data-testid="meta-description"></p>

  <div class="field">
    <h3>Fidelity</h3>
    <p class="fidelity">
      <span class="badge" data-testid="fidelity-badge"></span>
      <span class="explain" data-testid="fidelity-explanation"></span>
    </p>
  </div>

  <div class="field">
    <h3>Source</h3>
    <p class="citation" data-testid="citation"></p>
    <details class="bibtex" data-testid="bibtex-block" hidden>
      <summary>BibTeX</summary>
      <pre data-testid="bibtex"></pre>
      <button type="button" class="copy" data-testid="copy-bibtex">Copy</button>
    </details>
  </div>

  <div class="field notes-field" hidden>
    <h3>Notes</h3>
    <p class="notes" data-testid="meta-notes"></p>
  </div>

  <div class="field tags-field" hidden>
    <h3>Tags</h3>
    <ul class="tags" data-testid="meta-tags"></ul>
  </div>

  <div class="field">
    <h3>Files</h3>
    <ul class="links" data-testid="meta-links"></ul>
  </div>
</section>
