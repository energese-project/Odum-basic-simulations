<div class="shell" data-sidebar="closed">
  <header class="topbar" data-testid="topbar">
    <button type="button" class="icon-button" data-testid="sidebar-toggle"
            aria-controls="workbench-sidebar" aria-expanded="false"
            aria-label="Explorer" title="Explorer">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" />
        <path d="M6 2.5v11" stroke="currentColor" />
      </svg>
    </button>

    <h1 class="wordmark"><a href="/about" title="About this archive">Odum BASIC Simulations</a></h1>

    <span class="divider" aria-hidden="true"></span>

    <!-- Run acts on the program open in the explorer, whichever of its files
         the editor is showing. Fidelity is on every explorer row. -->
    <button type="button" class="action primary" data-testid="run">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
        <path d="M4 2.5v11l9-5.5z" fill="currentColor" />
      </svg>
      <span class="label">Run</span>
    </button>
    <button type="button" class="action" data-testid="stop" disabled>
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
        <rect x="3.5" y="3.5" width="9" height="9" rx="1" fill="currentColor" />
      </svg>
      <span class="label">Stop</span>
    </button>
    <button type="button" class="action" data-testid="download" disabled
            title="Download the plotted table as CSV">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
        <path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="label">CSV</span>
    </button>

    <div class="spacer"></div>

    <!-- After the spacer, with About and the theme toggle: it is page-level
         state, not a control that acts on the program named to the left. -->
    <engine-status></engine-status>
    <!-- The one way a program enters the archive: the issue form, which labels
         the issue for the submission bot and for Jules. The href is set from
         contributeUrl() in init(), so the repository is named in one place. -->
    <a class="action contribute" data-testid="contribute" target="_blank" rel="noopener"
       title="Add a program to the archive through a GitHub issue">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
        <path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" />
      </svg>
      <span class="label">Contribute</span>
    </a>
    <a class="about-link" href="/about">About</a>
    <theme-toggle></theme-toggle>
  </header>

  <div class="body">
    <aside id="workbench-sidebar" class="sidebar" data-testid="sidebar" aria-label="Explorer">
      <h2 class="pane-title">Explorer</h2>
      <program-explorer></program-explorer>
    </aside>
    <div class="scrim" data-testid="sidebar-scrim" aria-hidden="true"></div>

    <main class="panes">
      <section class="pane editor-pane" data-testid="editor-pane" aria-label="Program source">
        <h2 class="pane-title"><span class="filename" data-testid="editor-filename"></span></h2>
        <code-editor></code-editor>
      </section>

      <section class="pane output-pane" data-testid="output-pane" aria-label="Results">
        <div class="pane-block diagram-block" data-testid="diagram-pane" hidden>
          <h2 class="pane-title">
            Diagram
            <span class="figure-ref"></span>
          </h2>
          <a class="diagram-frame" target="_blank" rel="noopener" title="Open the diagram full size">
            <img alt="" decoding="async" />
          </a>
        </div>
        <div class="pane-block chart-block">
          <h2 class="pane-title">Plot</h2>
          <chart-panel></chart-panel>
          <!-- In place of the chart once a program sets a graphics mode: what it
               drew is its plot, and Odum's figures are pictures of this screen. -->
          <screen-panel hidden></screen-panel>
        </div>
        <div class="pane-block console-block">
          <h2 class="pane-title">
            Output
            <span class="status-group">
              <span class="status" data-testid="status"></span>
              <!-- CONT. Only there when there is something to continue. -->
              <button type="button" class="continue" data-testid="continue" hidden>Continue</button>
            </span>
          </h2>
          <console-panel></console-panel>
        </div>
      </section>
    </main>
  </div>
</div>
