<!-- role=status so a screen reader is told when the state settles, rather than
     a colour changing silently. aria-live is polite: this is never urgent. -->
<span class="engine-status" data-testid="engine-status" data-state="loading"
      role="status" aria-live="polite">
  <span class="dot" aria-hidden="true"></span>
  <span class="label" data-testid="engine-status-label">Engine loading</span>
</span>
