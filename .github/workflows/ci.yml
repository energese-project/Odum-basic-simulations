name: CI

on:
  pull_request:
    branches: [main, feat/**, fix/**, docs/**, chore/**]
  # Dispatched by program-submission.yml: a pull request opened with the
  # workflow token does not trigger `pull_request`, so the submission workflow
  # runs CI on the branch this way, and the result shows on the pull request.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The browser build has to match the @playwright/test version, which is why
      # that version carries no caret in package.json. Installing through the
      # local binary rather than a pinned `npx playwright@x` keeps the two from
      # drifting: there is one version string and this reads it.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Not the figures project: its goldens are pixels made in the Containerfile's
      # image, and this runner's fonts would fail every one. The job below runs it.
      - name: End-to-end tests
        run: npm run e2e -- --project=dev --project=production

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The paper's figures, compared against the goldens docs/article.tex includes.
  # A pixel comparison is only as good as the environment is fixed, so this runs
  # in the image `make test` uses locally, built from the same Containerfile, on
  # the same architecture: arm64, as on Apple silicon. Glyph antialiasing is not
  # guaranteed to match across CPU architectures, so an x86 runner would be
  # comparing machines rather than commits.
  figures:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Build the dev image
        run: docker build -f Containerfile -t odum-basic --build-arg NODE_VERSION="$(cat .node-version)" .

      - name: Figures
        run: docker run --rm --init -v "$PWD:/app" odum-basic sh -c 'npm ci && npm run e2e -- --project=figures'

      # On a failure the expected, actual and diff PNGs are in test-results/.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: figure-diffs
          path: test-results/
          retention-days: 7

  # The oracle attestation: regenerate every result in validation/oracle/ from
  # scratch — PC-BASIC's runs, the C engine's, the comparisons, the screens and
  # oracle.tex — and check each against SHA256SUMS, which is where the article's
  # numbers come from. A result that cannot be reproduced is not evidence, and
  # until this ran in CI nothing but a maintainer's memory said it still could be.
  #
  # arm64 for the same reason as `figures`, one step further: this compares bytes,
  # not pixels. The record was generated on Apple silicon, the PNGs are deflated by
  # the zlib inside the pinned Node image, and the oracle, engine and Node images
  # are pinned by digest — so the architecture is part of what makes the bytes
  # reproducible, and an x86 runner would be asking a different question.
  #
  # attest.sh rather than `make attest`, because that target depends on `start`,
  # which runs `container system start` — an Apple `container` command that docker
  # has no equivalent of. The script itself is container-agnostic: everything it
  # does goes through CONTAINER_BIN, and the two images' entrypoints (`pcbasic`,
  # and `sh -c` for the engine) take the same arguments either way.
  attest:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Attest
        run: CONTAINER_BIN=docker validation/oracle/attest.sh

      # A failure is a question, not an obstacle: either a change was meant to move
      # the results, or it is a bug. The diff is the answer, so print it rather than
      # making someone rerun the job locally to see it.
      - name: What moved
        if: ${{ failure() }}
        run: git diff --stat validation/oracle/ && git diff -- validation/oracle/ ':!*.png' ':!*.bin' ':!*.csv'

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: attest-regenerated
          path: validation/oracle/
          retention-days: 7

  # src/basic/engine.wasm is a committed build product. It has to be committed,
  # because Pages deploys with `npm ci && npm run build` on a runner with Node
  # and nothing else — no emscripten, no containers. The hazard of a committed
  # binary is that it stops following from the source it is supposed to be built
  # from, and nothing notices. So rebuild it here and fail if a byte moved.
  #
  # arm64 because that is where it is built by hand: emscripten/emsdk publishes
  # its version tags for amd64 only, so the pin is the multi-architecture index
  # digest, and Apple silicon takes the arm64 variant from it. Whether the two
  # variants emit identical bytes for the same source is not something this
  # repository has tested, so the job does not rely on it — it asks the question
  # it can answer, which is whether the committed artefact matches the source.
  wasm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The script, not `make wasm`, for the same reason the attestation calls
      # attest.sh: the target depends on `start`, which runs `container system
      # start`, and docker has no equivalent.
      - name: Rebuild engine.wasm and check the committed bytes
        run: CONTAINER_BIN=docker engine/build-wasm.sh --check

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: engine-wasm-rebuilt
          path: src/basic/engine.wasm
          retention-days: 7
