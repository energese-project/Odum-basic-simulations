name: CI

on:
  pull_request:
    branches: [main, feat/**, fix/**, docs/**, chore/**]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The browser build has to match the @playwright/test version, which is why
      # that version carries no caret in package.json. Installing through the
      # local binary rather than a pinned `npx playwright@x` keeps the two from
      # drifting: there is one version string and this reads it.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
